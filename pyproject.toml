[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "powerliftingml"
version = "0.1.0"
description = "Kaggle regression challenge for powerlifting performance prediction"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Team", email = "volodya.aleksanyan13@gmail.com"}
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "optuna>=4.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "tabicl>=2.2.0",
]
# AutoGluon (autogluon.tabular[lightgbm,catboost,xgboost]) est installé à part dans
# .venv-autogluon (Python 3.12), car il ne s'installe pas encore sous Python 3.14.

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipython>=8.10.0",
    "pytest>=7.3.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
ml = [
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
]
